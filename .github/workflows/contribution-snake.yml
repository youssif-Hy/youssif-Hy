name: Generate GitHub Contribution Graph

on:
  schedule:
    - cron: '23 4 * * *'  # once per day (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribution-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate dark and light contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: youssif-Hy
          outputs: |
            dist/github-snake-dark.svg?color_snake=%23B8D8EE&color_dots=%230E151F,%231B3044,%232B506C,%23407494,%23639FBD
            dist/github-snake-light.svg?color_snake=%23325E80&color_dots=%23EEF2F6,%23C9DAE5,%239DBED0,%2376A4BC,%234E829F

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'chore: update GitHub contributions animation'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
